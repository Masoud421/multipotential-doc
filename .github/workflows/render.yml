name: Render Multipotential Documentary

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js (LTS version)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. Install ffmpeg (Remotion v3 needs explicit ffmpeg)
      - name: Install ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      # 6. Run Remotion render
      - name: Render MP4
        run: |
          npx remotion render src/index-doc.ts MultipotentialDoc out/multipotential-doc.mp4 --codec=h264 --crf=20

      # 6. Upload the rendered video as an artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: multipotential-doc.mp4
          path: out/multipotential-doc.mp4
          retention-days: 7